      TopicName: !Sub 'FixyachipsAlerts-${AWS::StackName}'
      Subscription:
        - Endpoint: !Ref AdminEmail
          Protocol: email

  SignupWorkerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'Fixyachips-SignupWorker-Errors-${AWS::StackName}'
      AlarmDescription: Signup Lambda errors exceed threshold
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: FunctionName
          Value: !Ref SignupWorker
      AlarmActions:
        - !Ref AlertNotificationTopic
      OKActions:
        - !Ref AlertNotificationTopic

  StripeWebhookErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'Fixyachips-StripeWebhook-Errors-${AWS::StackName}'
      AlarmDescription: >
        CRITICAL: Stripe webhook errors may indicate payment processing failures
        or active signature verification attacks
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1  # Keep at 1 - any webhook failure needs immediate attention
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: FunctionName
          Value: !Ref StripeWebhookWorker
      AlarmActions:
        - !Ref AlertNotificationTopic
      OKActions:
        - !Ref AlertNotificationTopic

  SignupDLQMessageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'Fixyachips-SignupDLQ-Backlog-${AWS::StackName}'
      AlarmDescription: Dead letter queue accumulating failed signup messages
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: QueueName
          Value: !GetAtt SignupDLQ.QueueName
      AlarmActions:
        - !Ref AlertNotificationTopic
      OKActions:
        - !Ref AlertNotificationTopic

  StripeWebhookDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'Fixyachips-StripeWebhookDLQ-${AWS::StackName}'
      AlarmDescription: >
        CRITICAL: Failed Stripe webhooks accumulating - investigate payment provisioning
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: QueueName
          Value: !GetAtt StripeWebhookDLQ.QueueName
      AlarmActions:
        - !Ref AlertNotificationTopic
      OKActions:
        - !Ref AlertNotificationTopic

  ApiGateway5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'Fixyachips-API-5xxErrors-${AWS::StackName}'
      AlarmDescription: API Gateway returning 5xx server errors
      MetricName: 5XXError
      Namespace: AWS/ApiGateway
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: ApiName
          Value: !Ref PlatformApi
        - Name: Stage
          Value: !Ref Environment
      AlarmActions:
        - !Ref AlertNotificationTopic
      OKActions:
        - !Ref AlertNotificationTopic

  # NEW: Lambda throttle alarm (critical for payment processing)
  StripeWebhookThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'Fixyachips-StripeWebhook-Throttles-${AWS::StackName}'
      AlarmDescription: >
        Stripe webhook Lambda being throttled - payments may be delayed.
        Review ReservedConcurrentExecutions setting.
      MetricName: Throttles
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: FunctionName
          Value: !Ref StripeWebhookWorker
      AlarmActions:
        - !Ref AlertNotificationTopic
      OKActions:
        - !Ref AlertNotificationTopic

Outputs:

  CloudFrontDistributionId:
    Description: CloudFront Distribution ID
    Value: !Ref WebsiteDistribution
    Export:
      Name: !Sub '${AWS::StackName}-CloudFrontDistributionId'

  CloudFrontDomainName:
    Description: CloudFront distribution domain
    Value: !GetAtt WebsiteDistribution.DomainName
    Export:
      Name: !Sub '${AWS::StackName}-CloudFrontDomain'

  ApiGatewayEndpoint:
    Description: REST API endpoint URL
    Value: !Sub 'https://${PlatformApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub '${AWS::StackName}-ApiEndpoint'

  StripeSecretArn:
    Description: Secrets Manager ARN for Stripe credentials
    Value: !Ref StripeApiSecret
    Export:
      Name: !Sub '${AWS::StackName}-StripeSecretArn'

  VODKeyGroupId:
    Description: CloudFront Key Group ID for signed VOD URLs
    Condition: HasPublicKey
    Value: !Ref VODKeyGroup
    Export:
      Name: !Sub '${AWS::StackName}-VODKeyGroupId'

  StudentTableName:
    Description: DynamoDB Students table name
    Value: !Ref StudentTable
    Export:
      Name: !Sub '${AWS::StackName}-StudentTable'

  ContentBucketName:
    Description: S3 content bucket name
    Value: !Ref StreamingVideoBucket
    Export:
      Name: !Sub '${AWS::StackName}-ContentBucket'

  StripeWebhookDLQUrl:
    Description: DLQ URL for failed Stripe webhook messages
    Value: !Ref StripeWebhookDLQ

  SignupDLQUrl:
    Description: DLQ URL for failed signup messages
    Value: !Ref SignupDLQ

  MediaConvertQueueArn:
    Description: MediaConvert queue ARN for job submission
    Value: !GetAtt MediaConvertQueue.Arn
    Export:
      Name: !Sub '${AWS::StackName}-MediaConvertQueue'
