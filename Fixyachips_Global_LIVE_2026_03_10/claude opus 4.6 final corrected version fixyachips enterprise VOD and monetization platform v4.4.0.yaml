  # Stripe Webhook Worker Log Group
  StripeWebhookWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/FixyachipsStripeWebhook-${AWS::StackName}'
      RetentionInDays: 30

  # CRITICAL FIX: Full Stripe webhook handler with HMAC-SHA256 verification
  # CRITICAL FIX: Correct DynamoDB key derivation using uuid5
  StripeWebhookWorker:
    Type: AWS::Lambda::Function
    DependsOn: StripeWebhookWorkerLogGroup
    Properties:
      FunctionName: !Sub 'FixyachipsStripeWebhook-${AWS::StackName}'
      Description: Stripe webhook processor with HMAC signature verification
      Handler: index.lambda_handler
      Runtime: python3.12
      Role: !GetAtt FixyachipsMasterRole.Arn
      Timeout: 29
      MemorySize: 256
      ReservedConcurrentExecutions: 50
      TracingConfig:
        Mode: Active
      DeadLetterConfig:
        TargetArn: !GetAtt StripeWebhookDLQ.Arn
      Environment:
        Variables:
          SECRET_ARN: !Ref StripeApiSecret
          TABLE_NAME: !Ref StudentTable
          ENVIRONMENT: !Ref Environment
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          import logging
          import hmac
          import hashlib
          import time
          import uuid
          from datetime import datetime, timezone
          from botocore.exceptions import ClientError

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          _secrets_cache = None
          _secrets_cache_time = 0
          SECRETS_TTL = 300  # Cache secrets for 5 minutes


          def get_stripe_secrets():
              """Cached secrets retrieval to reduce Secrets Manager API calls."""
              global _secrets_cache, _secrets_cache_time
              current_time = time.time()
              if _secrets_cache and (current_time - _secrets_cache_time) < SECRETS_TTL:
                  return _secrets_cache
              client = boto3.client('secretsmanager')
              response = client.get_secret_value(SecretId=os.environ['SECRET_ARN'])
              _secrets_cache = json.loads(response['SecretString'])
              _secrets_cache_time = current_time
              return _secrets_cache


          def verify_stripe_signature(payload_body, sig_header, webhook_secret):
              """
              Verify Stripe webhook HMAC-SHA256 signature.
              Implements replay attack protection with 5-minute tolerance.
              """
              try:
                  timestamp = None
                  signatures = []
                  for element in sig_header.split(','):
                      key, value = element.split('=', 1)
                      if key == 't':
                          timestamp = int(value)
                      elif key == 'v1':
                          signatures.append(value)

                  if not timestamp or not signatures:
                      logger.error('Missing timestamp or v1 signatures')
                      return False

                  # Replay attack protection
                  age_seconds = abs(int(time.time()) - timestamp)
                  if age_seconds > 300:
                      logger.error('Webhook too old: %d seconds', age_seconds)
                      return False

                  signed_payload = f'{timestamp}.{payload_body}'
                  expected = hmac.new(
                      webhook_secret.encode('utf-8'),
                      signed_payload.encode('utf-8'),
                      hashlib.sha256
                  ).hexdigest()

                  return any(hmac.compare_digest(expected, sig) for sig in signatures)
              except Exception as e:
                  logger.error('Signature verification exception: %s', str(e))
                  return False


          def lambda_handler(event, context):
              try:
                  payload_body = event.get('body', '') or ''
                  if not payload_body:
                      return {'statusCode': 400, 'body': json.dumps({'error': 'Empty body'})}

                  headers = event.get('headers', {}) or {}
                  sig_header = (
                      headers.get('Stripe-Signature') or
                      headers.get('stripe-signature') or ''
                  )

                  if not sig_header:
                      logger.error('Missing Stripe-Signature header - possible replay attack')
                      return {'statusCode': 400, 'body': json.dumps({'error': 'Missing signature'})}

                  secrets = get_stripe_secrets()
                  webhook_secret = secrets.get('webhook_secret', '')

                  if not webhook_secret or 'REPLACE' in webhook_secret:
                      logger.error('Webhook secret not configured')
                      return {'statusCode': 500, 'body': json.dumps({'error': 'Config error'})}

                  if not verify_stripe_signature(payload_body, sig_header, webhook_secret):
                      logger.error('SECURITY: Stripe signature verification FAILED')
                      return {'statusCode': 403, 'body': json.dumps({'error': 'Invalid signature'})}

                  event_dict = json.loads(payload_body)
                  event_type = event_dict.get('type')
                  stripe_event_id = event_dict.get('id', 'unknown')

                  logger.info('Verified Stripe event: %s (id: %s)', event_type, stripe_event_id)

                  if event_type == 'checkout.session.completed':
                      session = event_dict.get('data', {}).get('object', {})
                      customer_email = session.get('customer_details', {}).get('email', '').lower().strip()
                      payment_status = session.get('payment_status')

                      if not customer_email or payment_status != 'paid':
                          logger.warning('Invalid session state: email=%s status=%s',
                                        bool(customer_email), payment_status)
                          return {'statusCode': 200, 'body': json.dumps({'received': True})}

                      # CRITICAL FIX: Use same uuid5 derivation as SignupWorker
                      student_id = str(uuid.uuid5(uuid.NAMESPACE_URL, 'fixyachips:' + customer_email))

                      table = boto3.resource('dynamodb').Table(os.environ['TABLE_NAME'])
                      try:
                          table.update_item(
                              Key={'StudentID': student_id},
                              UpdateExpression=(
                                  'SET #s = :status, Entitlement = :ent, '
                                  'Email = :email, StripeEventId = :eid, UpdatedAt = :ts'
                              ),
                              ExpressionAttributeNames={'#s': 'Status'},
                              ExpressionAttributeValues={
                                  ':status': 'ACTIVE_SUBSCRIBER',
                                  ':ent': 'VOD_FULL_ACCESS',
                                  ':email': customer_email,
                                  ':eid': stripe_event_id,
                                  ':ts': datetime.now(timezone.utc).isoformat()
                              }
                          )
                          logger.info('Provisioned VOD access: %s (event: %s)',
                                      student_id, stripe_event_id)
                      except ClientError as e:
                          logger.error('DynamoDB error: %s', e.response['Error']['Code'])
                          return {'statusCode': 500, 'body': json.dumps({'error': 'DB error'})}

                  return {'statusCode': 200, 'body': json.dumps({'received': True})}

              except json.JSONDecodeError:
                  logger.error('Invalid JSON in webhook body')
                  return {'statusCode': 400, 'body': json.dumps({'error': 'Invalid JSON'})}
              except Exception as err:
                  logger.error('Webhook failed: %s', str(err), exc_info=True)
                  return {'statusCode': 500, 'body': json.dumps({'error': 'Internal error'})}

  StripeWebhookPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref StripeWebhookWorker
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PlatformApi}/*/*/*'

  # MediaConvert Trigger
  MediaConvertTriggerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/FixyachipsMediaConvertTrigger-${AWS::StackName}'
      RetentionInDays: 14

  MediaConvertTriggerWorker:
    Type: AWS::Lambda::Function
    DependsOn: MediaConvertTriggerLogGroup
    Properties:
      FunctionName: !Sub 'FixyachipsMediaConvertTrigger-${AWS::StackName}'
      Description: Triggers MediaConvert HLS transcoding job on S3 upload
      Handler: index.lambda_handler
      Runtime: python3.12
      Role: !GetAtt FixyachipsMasterRole.Arn
      Timeout: 60
      MemorySize: 256
      ReservedConcurrentExecutions: 20
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          MEDIACONVERT_ROLE: !GetAtt MediaConvertRole.Arn
          QUEUE_ARN: !GetAtt MediaConvertQueue.Arn
          OUTPUT_BUCKET: !Ref StreamingVideoBucket
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          import logging
          import urllib.parse

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)


          def get_mediaconvert_endpoint():
              """Get account-specific MediaConvert endpoint (required for API calls)."""
              client = boto3.client('mediaconvert', region_name=os.environ.get('AWS_REGION', 'us-east-1'))
              response = client.describe_endpoints()
              return response['Endpoints'][0]['Url']


          def lambda_handler(event, context):
              """
              Triggered by S3 event when raw video is uploaded to raw/ prefix.
              Dispatches MediaConvert HLS adaptive bitrate transcoding job.
              """
              try:
                  for record in event.get('Records', []):
                      bucket = record['s3']['bucket']['name']
                      key = urllib.parse.unquote_plus(record['s3']['object']['key'])

                      # Only process files in raw/ prefix
                      if not key.startswith('raw/'):
                          logger.info('Skipping non-raw file: %s', key)
                          continue

                      output_key = key.replace('raw/', 'videos/', 1)
                      output_prefix = output_key.rsplit('/', 1)[0] + '/'

                      endpoint = get_mediaconvert_endpoint()
                      mc_client = boto3.client('mediaconvert', endpoint_url=endpoint)

                      job_settings = {
                          'Inputs': [{
                              'FileInput': f's3://{bucket}/{key}',
                              'AudioSelectors': {
                                  'Audio Selector 1': {'DefaultSelection': 'DEFAULT'}
                              }
                          }],
                          'OutputGroups': [{
                              'Name': 'HLS Output',
                              'OutputGroupSettings': {
                                  'Type': 'HLS_GROUP_SETTINGS',
                                  'HlsGroupSettings': {
                                      'Destination': f's3://{os.environ["OUTPUT_BUCKET"]}/{output_prefix}',
                                      'SegmentLength': 6,
                                      'MinSegmentLength': 0
                                  }
                              },
                              'Outputs': [
                                  {
                                      'NameModifier': '_1080p',
                                      'VideoDescription': {
                                          'Width': 1920, 'Height': 1080,
                                          'CodecSettings': {
                                              'Codec': 'H_264',
                                              'H264Settings': {
                                                  'Bitrate': 5000000,
                                                  'RateControlMode': 'CBR'
                                              }
                                          }
                                      },
                                      'AudioDescriptions': [{
                                          'CodecSettings': {
                                              'Codec': 'AAC',
                                              'AacSettings': {'Bitrate': 128000, 'SampleRate': 48000}
                                          }
                                      }],
                                      'ContainerSettings': {'Container': 'M3U8'}
                                  },
                                  {
                                      'NameModifier': '_720p',
                                      'VideoDescription': {
                                          'Width': 1280, 'Height': 720,
                                          'CodecSettings': {
                                              'Codec': 'H_264',
                                              'H264Settings': {
                                                  'Bitrate': 2500000,
                                                  'RateControlMode': 'CBR'
                                              }
                                          }
                                      },
                                      'AudioDescriptions': [{
                                          'CodecSettings': {
                                              'Codec': 'AAC',
                                              'AacSettings': {'Bitrate': 128000, 'SampleRate': 48000}
                                          }
                                      }],
                                      'ContainerSettings': {'Container': 'M3U8'}
                                  }
                              ]
                          }]
                      }

                      response = mc_client.create_job(
                          Role=os.environ['MEDIACONVERT_ROLE'],
                          Queue=os.environ['QUEUE_ARN'],
                          Settings=job_settings,
                          UserMetadata={
                              'source_bucket': bucket,
                              'source_key': key,
                              'output_prefix': output_prefix
                          }
                      )

                      logger.info('MediaConvert job created: %s', response['Job']['Id'])

                  return {'statusCode': 200, 'body': json.dumps('Jobs dispatched')}

              except Exception as e:
                  logger.error('MediaConvert trigger failed: %s', str(e), exc_info=True)
                  raise  # Re-raise so Lambda DLQ captures it

  # S3 Event Notification to trigger MediaConvert
  MediaConvertTriggerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref MediaConvertTriggerWorker
      Principal: s3.amazonaws.com
      SourceArn: !GetAtt StreamingVideoBucket.Arn
      SourceAccount: !Ref AWS::AccountId

