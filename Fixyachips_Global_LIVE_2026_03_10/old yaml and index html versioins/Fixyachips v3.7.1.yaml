AWSTemplateFormatVersion: '2010-09-09'
Description: 'Fixyachips Global v3.8: Pro-Tier Optimized with OAC'

Resources:
  # 1. THE LOCK (Origin Access Control)
  EmpireOAC:
    Type: 'AWS::CloudFront::OriginAccessControl'
    Properties: 
      OriginAccessControlConfig: 
        Name: !Sub 'Empire-OAC-${AWS::StackName}'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # 2. THE EDGE ROUTER
  WebsiteRouterFunction:
    Type: 'AWS::CloudFront::Function'
    Properties:
      Name: !Sub 'FixRouter-${AWS::StackName}'
      AutoPublish: true
      FunctionConfig:
        Comment: 'Fixes .html paths'
        Runtime: 'cloudfront-js-1.0'
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.endsWith('/')) { request.uri += 'index.html'; }
          else if (!uri.includes('.')) { request.uri += '.html'; }
          return request;
        }

  # 3. THE STORAGE
  StreamingVideoBucket:
    Type: 'AWS::S3::Bucket'
    Properties:
      BucketName: !Sub 'fixyachips-platform-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # 4. THE POLICY (Permissions)
  BucketPolicy:
    Type: 'AWS::S3::BucketPolicy'
    Properties:
      Bucket: !Ref StreamingVideoBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: 's3:GetObject'
            Resource: !Sub 'arn:aws:s3:::${StreamingVideoBucket}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:partition:cloudfront::${AWS::AccountId}:distribution/${WebsiteDistribution}'

  # 5. THE GLOBAL WEBSITE (CloudFront)
  WebsiteDistribution:
    Type: 'AWS::CloudFront::Distribution'
    Properties:
      DistributionConfig:
        Enabled: true
        PriceClass: PriceClass_All
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt StreamingVideoBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: "" # Leaves OAI empty to use OAC
            OriginAccessControlId: !GetAtt EmpireOAC.Id
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          ForwardedValues:
            QueryString: false
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt WebsiteRouterFunction.FunctionMetadata.FunctionARN

  # ... (Rest of your DynamoDB, IAM, and Cognito resources go here)
