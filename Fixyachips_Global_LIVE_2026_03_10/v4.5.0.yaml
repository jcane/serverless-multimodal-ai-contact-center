  CheckoutWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/FixyachipsCheckoutWorker-${AWS::StackName}'
      RetentionInDays: 30
  CheckoutWorker:
    Type: AWS::Lambda::Function
    DependsOn: CheckoutWorkerLogGroup
    Properties:
      FunctionName: !Sub 'FixyachipsCheckoutWorker-${AWS::StackName}'
      Description: Stripe Checkout Session creator using Stripe Python Layer and Secrets Manager
      Handler: index.lambda_handler
      Runtime: python3.12
      Role: !GetAtt FixyachipsMasterRole.Arn
      Timeout: 29
      MemorySize: 256
      ReservedConcurrentExecutions: 50
      TracingConfig:
        Mode: Active
      DeadLetterConfig:
        TargetArn: !GetAtt CheckoutWorkerDLQ.Arn
      Layers:
        - !Ref StripePythonLayer
      Environment:
        Variables:
          SECRET_ARN: !Ref StripeApiSecret
          PRICE_ID: !Sub 'price_REPLACE_WITH_REAL_PRICE_ID_${Environment}'
          ALLOWED_ORIGIN: 'https://fixyachips.com'
          SUCCESS_URL: 'https://fixyachips.com/success?session_id={CHECKOUT_SESSION_ID}'
          CANCEL_URL: 'https://fixyachips.com/pricing'
          ENVIRONMENT: !Ref Environment
      Code:
        ZipFile: |
          import json,os,time,logging,boto3,stripe
          from botocore.exceptions import ClientError
          logger=logging.getLogger()
          logger.setLevel(logging.INFO)
          AO=os.environ.get('ALLOWED_ORIGIN','https://fixyachips.com')
          CH={'Access-Control-Allow-Origin':AO,'Access-Control-Allow-Headers':'Content-Type','Access-Control-Allow-Methods':'POST, OPTIONS','Vary':'Origin'}
          _sc=None;_st=0;TTL=300
          def get_key():
              global _sc,_st
              t=time.time()
              if _sc and(t-_st)4096:return{'statusCode':413,'headers':CH,'body':json.dumps({'error':'Request too large'})}
                  try:b=json.loads(rb)if rb else{}
                  except json.JSONDecodeError:return{'statusCode':400,'headers':CH,'body':json.dumps({'error':'Invalid JSON'})}
                  ce=str(b.get('email','')).strip().lower()
                  pid=os.environ.get('PRICE_ID','')
                  if not pid or'REPLACE'in pid:return{'statusCode':500,'headers':CH,'body':json.dumps({'error':'Payment not configured'})}
                  stripe.api_key=get_key()
                  sp={'payment_method_types':['card'],'line_items':[{'price':pid,'quantity':1}],'mode':'payment','success_url':os.environ.get('SUCCESS_URL','https://fixyachips.com/success?session_id={CHECKOUT_SESSION_ID}'),'cancel_url':os.environ.get('CANCEL_URL','https://fixyachips.com/pricing'),'metadata':{'environment':os.environ.get('ENVIRONMENT','dev'),'source':'fixyachips-checkout'}}
                  if ce:sp['customer_email']=ce
                  ses=stripe.checkout.Session.create(**sp)
                  logger.info('Session created: %s email: %s',ses.id,ce or'anon')
                  return{'statusCode':200,'headers':CH,'body':json.dumps({'url':ses.url,'session_id':ses.id})}
              except ValueError as ve:
                  logger.error('Config: %s',str(ve))
                  return{'statusCode':500,'headers':CH,'body':json.dumps({'error':'Payment configuration error'})}
              except stripe.error.CardError as e:
                  return{'statusCode':402,'headers':CH,'body':json.dumps({'error':e.user_message})}
              except stripe.error.InvalidRequestError as e:
                  logger.error('Stripe invalid: %s',str(e))
                  return{'statusCode':400,'headers':CH,'body':json.dumps({'error':'Invalid payment request'})}
              except stripe.error.AuthenticationError:
                  logger.error('Stripe auth error - check api_key in Secrets Manager')
                  return{'statusCode':500,'headers':CH,'body':json.dumps({'error':'Payment authentication error'})}
              except stripe.error.StripeError as e:
                  logger.error('StripeError: %s',str(e))
                  return{'statusCode':502,'headers':CH,'body':json.dumps({'error':'Payment provider error'})}
              except Exception as e:
                  logger.error('Checkout error: %s',str(e),exc_info=True)
                  return{'statusCode':500,'headers':CH,'body':json.dumps({'error':'Internal server error'})}
