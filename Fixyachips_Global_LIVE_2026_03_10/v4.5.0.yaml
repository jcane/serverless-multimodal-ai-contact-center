  MediaConvertTriggerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/FixyachipsMediaConvertTrigger-${AWS::StackName}'
      RetentionInDays: 14
  MediaConvertTriggerWorker:
    Type: AWS::Lambda::Function
    DependsOn: MediaConvertTriggerLogGroup
    Properties:
      FunctionName: !Sub 'FixyachipsMediaConvertTrigger-${AWS::StackName}'
      Description: Triggers MediaConvert HLS transcoding job on S3 upload
      Handler: index.lambda_handler
      Runtime: python3.12
      Role: !GetAtt FixyachipsMasterRole.Arn
      Timeout: 60
      MemorySize: 256
      ReservedConcurrentExecutions: 20
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          MEDIACONVERT_ROLE: !GetAtt MediaConvertRole.Arn
          QUEUE_ARN: !GetAtt MediaConvertQueue.Arn
          OUTPUT_BUCKET: !Sub 'fixyachips-platform-${AWS::AccountId}-${Environment}'
      Code:
        ZipFile: |
          import json,boto3,os,logging,urllib.parse
          logger=logging.getLogger()
          logger.setLevel(logging.INFO)
          _ec=None
          def get_ep():
              global _ec
              if _ec:return _ec
              c=boto3.client('mediaconvert',region_name=os.environ.get('AWS_REGION','us-east-1'))
              _ec=c.describe_endpoints()['Endpoints'][0]['Url']
              return _ec
          def lambda_handler(event,context):
              try:
                  for rec in event.get('Records',[]):
                      bkt=rec['s3']['bucket']['name']
                      key=urllib.parse.unquote_plus(rec['s3']['object']['key'])
                      if not key.startswith('raw/'):continue
                      op=key.replace('raw/','videos/',1).rsplit('/',1)[0]+'/'
                      mc=boto3.client('mediaconvert',endpoint_url=get_ep())
                      js={'Inputs':[{'FileInput':f's3://{bkt}/{key}','AudioSelectors':{'Audio Selector 1':{'DefaultSelection':'DEFAULT'}}}],'OutputGroups':[{'Name':'HLS Output','OutputGroupSettings':{'Type':'HLS_GROUP_SETTINGS','HlsGroupSettings':{'Destination':f's3://{os.environ["OUTPUT_BUCKET"]}/{op}','SegmentLength':6,'MinSegmentLength':0}},'Outputs':[{'NameModifier':'_1080p','VideoDescription':{'Width':1920,'Height':1080,'CodecSettings':{'Codec':'H_264','H264Settings':{'Bitrate':5000000,'RateControlMode':'CBR'}}},'AudioDescriptions':[{'CodecSettings':{'Codec':'AAC','AacSettings':{'Bitrate':128000,'SampleRate':48000}}}],'ContainerSettings':{'Container':'M3U8'}},{'NameModifier':'_720p','VideoDescription':{'Width':1280,'Height':720,'CodecSettings':{'Codec':'H_264','H264Settings':{'Bitrate':2500000,'RateControlMode':'CBR'}}},'AudioDescriptions':[{'CodecSettings':{'Codec':'AAC','AacSettings':{'Bitrate':128000,'SampleRate':48000}}}],'ContainerSettings':{'Container':'M3U8'}}]}]}
                      r=mc.create_job(Role=os.environ['MEDIACONVERT_ROLE'],Queue=os.environ['QUEUE_ARN'],Settings=js,UserMetadata={'source_bucket':bkt,'source_key':key,'output_prefix':op})
                      logger.info('MediaConvert job created: %s',r['Job']['Id'])
                  return{'statusCode':200,'body':json.dumps('Jobs dispatched')}
              except Exception as e:
                  logger.error('MediaConvert trigger failed: %s',str(e),exc_info=True)
                  raise
  MediaConvertTriggerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref MediaConvertTriggerWorker
      Principal: s3.amazonaws.com
      SourceArn: !Sub 'arn:aws:s3:::fixyachips-platform-${AWS::AccountId}-${Environment}'
