  SignupWorker:
    Type: AWS::Lambda::Function
    DependsOn: SignupWorkerLogGroup
    Properties:
      FunctionName: !Sub 'FixyachipsSignupWorker-${AWS::StackName}'
      Description: Waitlist signup handler with input validation and duplicate prevention
      Handler: index.lambda_handler
      Runtime: python3.12
      Role: !GetAtt FixyachipsMasterRole.Arn
      Timeout: 29
      MemorySize: 256
      ReservedConcurrentExecutions: 100
      TracingConfig:
        Mode: Active
      DeadLetterConfig:
        TargetArn: !GetAtt SignupDLQ.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref StudentTable
          ADMIN_EMAIL: !Ref AdminEmail
          ALLOWED_ORIGIN: 'https://fixyachips.com'
          ENVIRONMENT: !Ref Environment
          LOG_LEVEL: !If [IsProduction, 'WARNING', 'INFO']
      Code:
        ZipFile: |
          import json,boto3,uuid,os,re,logging
          from datetime import datetime,timezone
          from botocore.exceptions import ClientError
          logger=logging.getLogger()
          logger.setLevel(os.environ.get('LOG_LEVEL','WARNING'))
          EP=re.compile(r'^[a-zA-Z0-9._%+\-]{1,64}@[a-zA-Z0-9.\-]{1,253}\.[a-zA-Z]{2,}$')
          NP=re.compile(r"^[a-zA-Z\s'\-\.]{2,100}$")
          AO=os.environ.get('ALLOWED_ORIGIN','https://fixyachips.com')
          CH={'Access-Control-Allow-Origin':AO,'Access-Control-Allow-Headers':'Content-Type','Access-Control-Allow-Methods':'POST, OPTIONS','Vary':'Origin'}
          def vi(email,name):
              if not email or len(email)>254:return False,'Invalid email address'
              if not EP.match(email):return False,'Invalid email format'
              if not name or len(name)<2 or len(name)>100:return False,'Name must be between 2 and 100 characters'
              if not NP.match(name):return False,'Name contains invalid characters'
              return True,''
          def lambda_handler(event,context):
              if event.get('httpMethod')=='OPTIONS':return{'statusCode':200,'headers':CH,'body':''}
              if event.get('httpMethod')!='POST':return{'statusCode':405,'headers':CH,'body':json.dumps({'error':'Method not allowed'})}
              try:
                  rb=event.get('body',''or'')
                  if len(rb)>10240:return{'statusCode':413,'headers':CH,'body':json.dumps({'error':'Request too large'})}
                  try:b=json.loads(rb)
                  except json.JSONDecodeError:return{'statusCode':400,'headers':CH,'body':json.dumps({'error':'Invalid JSON'})}
                  email=str(b.get('email','')).strip().lower()
                  name=str(b.get('name','')).strip()
                  ok,msg=vi(email,name)
                  if not ok:return{'statusCode':400,'headers':CH,'body':json.dumps({'error':msg})}
                  sid=str(uuid.uuid5(uuid.NAMESPACE_URL,'fixyachips:'+email))
                  now=datetime.now(timezone.utc).isoformat()
                  t=boto3.resource('dynamodb').Table(os.environ['TABLE_NAME'])
                  try:
                      t.put_item(Item={'StudentID':sid,'Name':name,'Email':email,'Status':'WAITLIST','CreatedAt':now},ConditionExpression='attribute_not_exists(StudentID) OR #s = :waitlist',ExpressionAttributeNames={'#s':'Status'},ExpressionAttributeValues={':waitlist':'WAITLIST'})
                  except ClientError as e:
                      if e.response['Error']['Code']=='ConditionalCheckFailedException':return{'statusCode':200,'headers':CH,'body':json.dumps({'status':'success'})}
                      raise
                  return{'statusCode':200,'headers':CH,'body':json.dumps({'status':'success'})}
              except Exception as exc:
                  logger.error('Signup error: %s',str(exc),exc_info=True)
                  return{'statusCode':500,'headers':CH,'body':json.dumps({'error':'Internal server error'})}
