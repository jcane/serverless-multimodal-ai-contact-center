          SECRET_ARN: !Ref StripeApiSecret
          TABLE_NAME: !Ref StudentTable
          ENVIRONMENT: !Ref Environment
      Code:
        ZipFile: |
          import json,boto3,os,logging,hmac,hashlib,time,uuid
          from datetime import datetime,timezone
          from botocore.exceptions import ClientError
          logger=logging.getLogger()
          logger.setLevel(logging.INFO)
          _sc=None
          _st=0
          TTL=300
         def get_secrets():
              global _sc,_st
              t=time.time()
              if _sc and(t-_st)300:return False
                  sp=f'{ts}.{body}'
                  exp=hmac.new(secret.encode(),msg=sp.encode(),digestmod=hashlib.sha256).hexdigest()
                  return any(hmac.compare_digest(exp,s)for s in sigs)
              except Exception:return False
          def lambda_handler(event,context):
              try:
                  pb=event.get('body',''or'')
                  if not pb:return{'statusCode':400,'body':json.dumps({'error':'Empty body'})}
                  hdr=(event.get('headers',{})or{})
                  sh=hdr.get('Stripe-Signature')or hdr.get('stripe-signature')or''
                  if not sh:return{'statusCode':400,'body':json.dumps({'error':'Missing signature'})}
                  s=get_secrets()
                  ws=s.get('webhook_secret','')
                  if not ws or'REPLACE'in ws:return{'statusCode':500,'body':json.dumps({'error':'Config error'})}
                  if not verify_sig(pb,sh,ws):
                      logger.error('SECURITY: Stripe signature verification FAILED')
                      return{'statusCode':403,'body':json.dumps({'error':'Invalid signature'})}
                  ed=json.loads(pb)
                  et=ed.get('type')
                  eid=ed.get('id','unknown')
                  logger.info('Verified Stripe event: %s (id: %s)',et,eid)
                  if et=='checkout.session.completed':
                      ses=ed.get('data',{}).get('object',{})
                      ce=ses.get('customer_details',{}).get('email','').lower().strip()
                      ps=ses.get('payment_status')
                      if not ce or ps!='paid':return{'statusCode':200,'body':json.dumps({'received':True})}
                      sid=str(uuid.uuid5(uuid.NAMESPACE_URL,'fixyachips:'+ce))
                      t=boto3.resource('dynamodb').Table(os.environ['TABLE_NAME'])
                      try:
                          t.update_item(Key={'StudentID':sid},UpdateExpression='SET #s = :status, Entitlement = :ent, Email = :email, StripeEventId = :eid, UpdatedAt = :ts',ExpressionAttributeNames={'#s':'Status'},ExpressionAttributeValues={':status':'ACTIVE_SUBSCRIBER',':ent':'VOD_FULL_ACCESS',':email':ce,':eid':eid,':ts':datetime.now(timezone.utc).isoformat()})
                      except ClientError as e:
                          logger.error('DynamoDB error: %s',e.response['Error']['Code'])
                          return{'statusCode':500,'body':json.dumps({'error':'DB error'})}
                  return{'statusCode':200,'body':json.dumps({'received':True})}
              except json.JSONDecodeError:return{'statusCode':400,'body':json.dumps({'error':'Invalid JSON'})}
              except Exception as err:
                  logger.error('Webhook failed: %s',str(err),exc_info=True)
                  return{'statusCode':500,'body':json.dumps({'error':'Internal error'})}
