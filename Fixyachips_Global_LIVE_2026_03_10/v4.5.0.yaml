      AlarmActions:
        - !Ref AlertNotificationTopic
      OKActions:
        - !Ref AlertNotificationTopic
  StripeWebhookErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'Fixyachips-StripeWebhook-Errors-${AWS::StackName}'
      AlarmDescription: CRITICAL Stripe webhook errors may indicate payment processing failures
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: FunctionName
          Value: !Ref StripeWebhookWorker
      AlarmActions:
        - !Ref AlertNotificationTopic
      OKActions:
        - !Ref AlertNotificationTopic
  SignupDLQMessageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'Fixyachips-SignupDLQ-Backlog-${AWS::StackName}'
      AlarmDescription: Dead letter queue accumulating failed signup messages
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: QueueName
          Value: !GetAtt SignupDLQ.QueueName
      AlarmActions:
        - !Ref AlertNotificationTopic
      OKActions:
        - !Ref AlertNotificationTopic
  StripeWebhookDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'Fixyachips-StripeWebhookDLQ-${AWS::StackName}'
      AlarmDescription: CRITICAL Failed Stripe webhooks accumulating
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: QueueName
          Value: !GetAtt StripeWebhookDLQ.QueueName
      AlarmActions:
        - !Ref AlertNotificationTopic
      OKActions:
        - !Ref AlertNotificationTopic
  ApiGateway5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'Fixyachips-API-5xxErrors-${AWS::StackName}'
      AlarmDescription: API Gateway returning 5xx server errors
      MetricName: 5XXError
      Namespace: AWS/ApiGateway
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: ApiName
          Value: !Sub 'FixyachipsAPI-${AWS::StackName}'
        - Name: Stage
          Value: !Ref Environment
      AlarmActions:
        - !Ref AlertNotificationTopic
      OKActions:
        - !Ref AlertNotificationTopic
  StripeWebhookThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'Fixyachips-StripeWebhook-Throttles-${AWS::StackName}'
      AlarmDescription: Stripe webhook Lambda being throttled
      MetricName: Throttles
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: FunctionName
          Value: !Ref StripeWebhookWorker
      AlarmActions:
        - !Ref AlertNotificationTopic
      OKActions:
        - !Ref AlertNotificationTopic
  CheckoutWorkerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'Fixyachips-CheckoutWorker-Errors-${AWS::StackName}'
      AlarmDescription: CRITICAL CheckoutWorker errors indicate failed Stripe session creation
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: FunctionName
          Value: !Ref CheckoutWorker
      AlarmActions:
        - !Ref AlertNotificationTopic
      OKActions:
        - !Ref AlertNotificationTopic
  CheckoutWorkerDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'Fixyachips-CheckoutDLQ-${AWS::StackName}'
      AlarmDescription: CRITICAL Failed Stripe checkout session creations accumulating
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
