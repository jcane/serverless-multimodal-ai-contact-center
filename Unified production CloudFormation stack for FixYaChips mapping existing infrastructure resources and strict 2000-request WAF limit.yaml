AWSTemplateFormatVersion: '2010-09-09'
Description: Unified production CloudFormation stack for FixYaChips mapping existing infrastructure resources and strict 2000-request WAF limit.

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues:
      - production
      - staging
    Description: Environment name for resource tagging and naming.

Resources:
  # ----------------------------------------------------------
  # S3 BUCKETS (Mapped to existing FixYaChips assets)
  # ----------------------------------------------------------
  OriginalFixYaChipsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: fixyachips
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  WebsitePlatformBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: fixyachips-platform-980049663300
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  VodDestinationBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: videondemandfixyachips-destination920a3c57-ykrxy0jwcztr
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  AccessLogsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: fixyachips-logs-980049663300
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ----------------------------------------------------------
  # DYNAMODB TABLES (Adopted from App V1)
  # ----------------------------------------------------------
  StudentTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: FixyachipsStudents-Fixyachips-App-V1
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: StudentID
          AttributeType: S
      KeySchema:
        - AttributeName: StudentID
          KeyType: HASH

  VodHeartbeatsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: FixYaChips-VOD-Heartbeats
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  # ----------------------------------------------------------
  # IAM ROLE FOR LAMBDA WORKER
  # ----------------------------------------------------------
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'fixyachips-signup-worker-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt StudentTable.Arn

  # ----------------------------------------------------------
  # LAMBDA WORKER (Adopted Function Name & Python 3.12 Runtime)
  # ----------------------------------------------------------
  SignupWorker:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: FixyachipsSignupWorker-Fixyachips-App-V1
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref StudentTable
          VOD_BUCKET: !Ref VodDestinationBucket
      Code:
        ZipFile: |
          import json
          import os

          def handler(event, context):
              print("Signup Worker Event:", json.dumps(event))
              return {
                  "statusCode": 200,
                  "headers": {
                      "Access-Control-Allow-Origin": "https://fixyachips.com",
                      "Access-Control-Allow-Credentials": "true"
                  },
                  "body": json.dumps({"message": "Signup processed successfully!"})
              }

  # ----------------------------------------------------------
  # AWS WAF v2 WEB ACL (Strict 2,000 Request Limit per IP)
  # ----------------------------------------------------------
  WebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub 'fixyachips-waf-${Environment}'
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: !Sub 'fixyachips-waf-${Environment}'
        SampledRequestsEnabled: true
      Rules:
        - Name: Limit2000RequestsPerIP
          Priority: 1
          Action:
            Block: {}
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: Limit2000RequestsPerIPMetric
            SampledRequestsEnabled: true
          Statement:
            RateBasedStatement:
              Limit: 2000
              AggregateKeyType: IP

  # ----------------------------------------------------------
  # API GATEWAY (Adopted API Name)
  # ----------------------------------------------------------
  SignupAPI:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: FixyachipsAPI-Fixyachips-App-V1
      EndpointConfiguration:
        Types:
          - REGIONAL

  ApiResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref SignupAPI
      ParentId: !GetAtt SignupAPI.RootResourceId
      PathPart: signup

  ApiRequestValidator:
    Type: AWS::ApiGateway::RequestValidator
    Properties:
      RestApiId: !Ref SignupAPI
      Name: !Sub 'fixyachips-validator-${Environment}'
      ValidateRequestBody: true
      ValidateRequestParameters: true

  # ----------------------------------------------------------
  # API GATEWAY METHODS (POST & OPTIONS)
  # ----------------------------------------------------------
  ApiPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SignupAPI
      ResourceId: !Ref ApiResource
      HttpMethod: POST
      AuthorizationType: NONE
      RequestValidatorId: !Ref ApiRequestValidator
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SignupWorker.Arn}/invocations'
      MethodResponses:
        - StatusCode: '200'

  ApiOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SignupAPI
      ResourceId: !Ref ApiResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: '200'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'https://fixyachips.com'"
            ResponseTemplates:
              application/json: ''
      MethodResponses:
        - StatusCode: '200'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  # ----------------------------------------------------------
  # API GATEWAY DEPLOYMENT & STAGE
  # ----------------------------------------------------------
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - ApiPostMethod
      - ApiOptionsMethod
    Properties:
      RestApiId: !Ref SignupAPI

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref SignupAPI
      DeploymentId: !Ref ApiDeployment
      StageName: prod
      TracingEnabled: true
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          LoggingLevel: INFO
          DataTraceEnabled: true
          MetricsEnabled: true

  # ----------------------------------------------------------
  # WEB ACL ASSOCIATION TO API GATEWAY STAGE
  # ----------------------------------------------------------
  WebACLAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Sub 'arn:aws:apigateway:${AWS::Region}:${AWS::AccountId}/restapis/${SignupAPI}/stages/prod'
      WebACLArn: !GetAtt WebACL.Arn

  # ----------------------------------------------------------
  # LAMBDA PERMISSION FOR API GATEWAY
  # ----------------------------------------------------------
  LambdaApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt SignupWorker.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${SignupAPI}/*/*/signup'

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL for signup
    Value: !Sub 'https://${SignupAPI}.execute-api.${AWS::Region}.amazonaws.com/prod/signup'
  WafArn:
    Description: ARN of the WAF Web ACL protecting the signup endpoint with a strict 2000 request limit
    Value: !GetAtt WebACL.Arn
  WebsiteBucketName:
    Description: S3 Bucket hosting the frontend platform UI
    Value: !Ref WebsitePlatformBucket
  VodDestinationBucketName:
    Description: S3 Bucket holding finished VOD instructional assets
    Value: !Ref VodDestinationBucket
