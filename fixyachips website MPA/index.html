<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <title>Fixyachips | The No-Drill Revolution</title>
</head>
<body>
    <header>
        <img src="logos/fixyachips-shield-logo.png" class="logo-shield" alt="Shield Logo">
        <h1>FIXYACHIPS GLOBAL SOLUTIONS LLC</h1>
    </header>

    <div class="container">
        <div class="video-container">
            <iframe width="100%" height="100%" src="https://www.youtube.com/embed/D1VxWP3wFfI?start=11" frameborder="0" allowfullscreen></iframe>
        </div>

        <section class="hero-overlay">
            <div class="overlay-content">
                <div class="benefits-grid">
                    <div class="benefit-card"><h3>Total Saturation</h3></div>
                    <div class="benefit-card"><h3>Structural Integrity</h3></div>

            <p>EMPOWERING OTHERS WITH WISDOM, UNDERSTANDING AND KNOWLEDGE!!</p>
        </div>

        <button id="email-trigger-btn">Join the No-Drill Revolution</button>
    </div>

    <div id="email-popup" class="modal">
        <h3>Stay Updated</h3>
        <input type="email" placeholder="Your email...">
        <button id="close-popup">Close</button>
    </div>

    <script src="js/app.js"></script>

</html>
