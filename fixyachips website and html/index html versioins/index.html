<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixyachips | The Global Standard in 4K Repairs</title>
    <style>
        :root { --main-gold: #FFD700; --bg-dark: #1a1a1a; --text-light: #f4f4f4; }
        body { background-color: var(--bg-dark); color: var(--text-light); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; text-align: center; }
        .container { padding: 2rem; border: 2px solid var(--main-gold); border-radius: 15px; background: rgba(0,0,0,0.5); box-shadow: 0 0 20px rgba(255, 215, 0, 0.2); }
        h1 { color: var(--main-gold); font-size: 3rem; margin-bottom: 0; }
        p { font-size: 1.2rem; max-width: 600px; line-height: 1.6; }
        .form-group { margin-top: 2rem; display: flex; flex-direction: column; gap: 10px; }
        input { padding: 12px; border-radius: 5px; border: none; width: 300px; font-size: 1rem; }
        button { background-color: var(--main-gold); color: black; border: none; padding: 15px 30px; font-size: 1.1rem; font-weight: bold; border-radius: 5px; cursor: pointer; transition: transform 0.2s; }
        button:hover { transform: scale(1.05); background-color: #e6c200; }
        .badge { background: var(--main-gold); color: black; padding: 5px 15px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">COMING SOON</div>
        <h1>FIXYACHIPS</h1>
        <p>Mastering the art of 4K repairs. From "No-Drill" techniques to global diagnostics, we're building the master manual for the next generation of technicians.</p>
        
        <div class="form-group">
            <input type="text" placeholder="Your Name" id="studentName">
            <input type="email" placeholder="Your Email Address" id="studentEmail">
            <button onclick="alert('Welcome to the inner circle. We will notify you when the first 4K repair manual drops.')">JOIN THE WAITING LIST</button>
        </div>
    </div>
</body>
</html>
