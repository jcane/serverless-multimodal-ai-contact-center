AWSTemplateFormatVersion: '2010-09-09'
Description: 'Fixyachips Global: High-Performance VOD, AI Manuals, and WAF Security'

Parameters:
  AdminEmail:
    Type: String
    Default: 'info@fixyachips.com'

Resources:
  # --- 1. SECURITY LAYER (AWS WAF) ---
  WebBodyguard:
    Type: 'AWS::WAFv2::WebACL'
    Properties:
      Name: !Sub 'FixyachipsWAF-${AWS::StackName}'
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: FixyachipsWAF
      Rules:
        - Name: AWS-AWSManagedRulesCommonRuleSet
          Priority: 0
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          OverrideAction:
            None: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: CommonRules

  # --- 2. STORAGE LAYER (S3 with OAC) ---
  MasterVideoBucket:
    Type: 'AWS::S3::Bucket'
    Properties:
      BucketName: !Sub 'fixyachips-masters-${AWS::AccountId}'
      Tags: [{Key: Project, Value: Fixyachips}]

  StreamingVideoBucket:
    Type: 'AWS::S3::Bucket'
    Properties:
      BucketName: !Sub 'fixyachips-streaming-${AWS::AccountId}'
      Tags: [{Key: Project, Value: Fixyachips}]

  ManualsBucket:
    Type: 'AWS::S3::Bucket'
    Properties:
      BucketName: !Sub 'fixyachips-manuals-${AWS::AccountId}'
      Tags: [{Key: Project, Value: Fixyachips}]

  # --- 3. EDGE LOGIC (CloudFront Function) ---
  UrlRewriteFunction:
    Type: 'AWS::CloudFront::Function'
    Properties:
      Name: !Sub 'FixyachipsUrlRewrite-${AWS::StackName}'
      FunctionConfig:
        Comment: 'Lightweight URL rewrite'
        Runtime: cloudfront-js-1.0
      FunctionCode: |
        function handler(event) {
            var request = event.request;
            if (request.uri.endsWith('/')) { request.uri += 'index.html'; }
            return request;
        }
      AutoPublish: true

  # --- 4. DELIVERY LAYER (CloudFront + WAF) ---
  CloudFrontOAC:
    Type: 'AWS::CloudFront::OriginAccessControl'
    Properties: 
      OriginAccessControlConfig: 
        Description: 'OAC for Fixyachips'
        Name: !Sub 'FixyachipsOAC-${AWS::StackName}'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  StreamingDistribution:
    Type: 'AWS::CloudFront::Distribution'
    Properties:
      DistributionConfig:
        Enabled: true
        PriceClass: PriceClass_All
        DefaultRootObject: index.html
        WebACLId: !GetAtt WebBodyguard.Arn
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt StreamingVideoBucket.DomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt UrlRewriteFunction.FunctionMetadata.FunctionARN
      Tags: [{Key: Project, Value: Fixyachips}]

  # --- 5. DATABASE LAYER (DynamoDB) ---
  StudentTable:
    Type: 'AWS::DynamoDB::Table'
    Properties:
      TableName: !Sub 'FixyachipsStudents-${AWS::StackName}'
      AttributeDefinitions: [{AttributeName: StudentID, AttributeType: S}]
      KeySchema: [{AttributeName: StudentID, KeyType: HASH}]
      BillingMode: PAY_PER_REQUEST
      Tags: [{Key: Project, Value: Fixyachips}]

  # --- 6. AI & MANAGEMENT (IAM Roles) ---
  FixyachipsMasterRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: [lambda.amazonaws.com, states.amazonaws.com, bedrock.amazonaws.com]
            Action: ['sts:AssumeRole']
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: FixyachipsAIPowerhouse
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['s3:*', 'dynamodb:*', 'rekognition:*', 'transcribe:*', 'translate:*', 'polly:*', 'bedrock:*', 'ses:SendEmail']
                Resource: '*'
      Tags: [{Key: Project, Value: Fixyachips}]

  # --- 7. BUDGET PROTECTION ---
  SafetyBudget:
    Type: 'AWS::Budgets::Budget'
    Properties:
      Budget:
        BudgetName: !Sub 'FixyachipsBudget-${AWS::StackName}'
        BudgetLimit: { Amount: 100, Unit: USD }
        TimeUnit: MONTHLY
        BudgetType: COST
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80 }
          Subscribers: [{ Address: !Ref AdminEmail, SubscriptionType: EMAIL }]

Outputs:
  CloudFrontURL:
    Value: !GetAtt StreamingDistribution.DomainName
  S3BucketForWebsite:
    Value: !Ref StreamingVideoBucket
